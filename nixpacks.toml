# Nixpacks configuration for Coolify / Belmo deployment
[variables]
PORT = "3000"
HOST = "0.0.0.0"
CGO_ENABLED = "0"
GOPROXY = "https://proxy.golang.org,direct"

[phases.setup]
aptPkgs = ["curl", "wget", "ca-certificates"]

[phases.build]
cmds = ["go build -o server ./cmd/server"]

[start]
cmd = "./server -config config.example.json -listen :3000"
